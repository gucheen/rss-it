<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS it</title>
    <meta name="description" content="RSS those don't have RSS." />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS for RSS-it"
      href="/?id=rss_it_homepage"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
    />
    <style>
      td {
        word-break: break-word;
      }
    </style>
  </head>

  <body>
    <header class="container">
      <hgroup>
        <h1>RSS it</h1>
        <p>RSS those don't have RSS.</p>
      </hgroup>
    </header>
    <main class="container">
      <section class="entries">
        <h2>Current RSS Entries</h2>
        <table class="striped">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Website</th>
              <th scope="col">Feed Link</th>
              <th scope="col">Rule Updated</th>
              <th scope="col">Latest Content</th>
            </tr>
          </thead>
          <tbody>
            <!-- RSS_IT_ENTRY_ROWS -->
          </tbody>
        </table>
      </section>
    </main>
    <footer class="container">
      <small
        >Powered by
        <a href="https://github.com/gucheen/rss-it">RSS-it</a>.</small
      >
      <span
        ><small
          >And of course
          <a href="/?id=rss_it_homepage">RSS of RSS-it self</a></small
        >.</span
      >
    </footer>
  </body>
</html>
